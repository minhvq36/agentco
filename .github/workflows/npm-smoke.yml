# Install the npm package on all three operating systems and run it.
# -> scripts/smoke-npm.ts · docs/SPEC-cli.md §6
#
# 🔴 IT RUNS ON A TARBALL, NOT ON THE REGISTRY. Before the first publish there
# is nothing on npm to install, and after it a failure found here would cost a
# version number that can never be cut again. `npm pack` is the exact file
# `npm publish` uploads, so this is the test of the package — just earlier.
#
# `workflow_call` so the publish job can require it: nothing reaches npm
# without having run on Linux, macOS and Windows first.

name: npm smoke

on:
  workflow_dispatch:
    inputs:
      from-registry:
        description: Install name@version from npm instead of packing the checkout
        type: boolean
        default: false
  # `from-registry: true` is the check AFTER a publish, from release.yml: what
  # npm serves is what was tested before it went out.
  workflow_call:
    inputs:
      from-registry:
        type: boolean
        default: false
  # Anything that changes what the tarball contains, how it starts, or whether
  # the suite still passes. Seven jobs a push is the price; finding out at
  # release time is the alternative, and that is what this list is widened for:
  # a test-only commit used to reach `main` without running once.
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - test/**
      - web/**
      - installer/logo.png
      - scripts/**
      - .github/workflows/npm-smoke.yml

permissions:
  contents: read

jobs:
  # ┌────────────────────────────────────────────────────────────────────────┐
  # │ 🔴 THE SUITE USED TO RUN ONLY ON A TAG, i.e. only while cutting a       │
  # │ release. (added 16/09/2026, after it cost one)                          │
  # │                                                                         │
  # │ `release.yml` runs `npm test` BEFORE `build:all`, so a test that needs   │
  # │ `web/dist` passes on a developer machine — where it is lying around      │
  # │ from the last build — and fails on CI at the one moment nothing else     │
  # │ can proceed. Every push to `main` was green while `main` was broken.     │
  # │                                                                         │
  # │ ⚠ It deliberately does NOT build the web bundle first. Running the       │
  # │ suite in the same barren state `release.yml` gives it is the whole       │
  # │ point: a test that quietly depends on a build artefact must fail HERE.   │
  # │                                                                         │
  # │ ⚠ windows-latest, because that is the only platform the suite has ever   │
  # │ run on. Adding Linux is worth doing and is a separate change with its    │
  # │ own failures to read.                                                    │
  # └────────────────────────────────────────────────────────────────────────┘
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `engines` says >=22. 22 is what most people have; 24 is the current
        # LTS a fresh install gets — the one nobody on this project runs.
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm --prefix web ci

      # The two tools a Linux desktop brings: the spec's validator, and the
      # launcher library that reads a .desktop file the way a click does.
      - name: Desktop tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils libglib2.0-bin

      - run: npm run smoke:npm
        env:
          SMOKE_STRICT: '1'
          SMOKE_FROM_REGISTRY: ${{ inputs.from-registry && '1' || '' }}

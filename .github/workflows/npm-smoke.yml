# Install the npm package on all three operating systems and run it.
# -> scripts/smoke-npm.ts · docs/SPEC-cli.md §6
#
# 🔴 IT RUNS ON A TARBALL, NOT ON THE REGISTRY. Before the first publish there
# is nothing on npm to install, and after it a failure found here would cost a
# version number that can never be cut again. `npm pack` is the exact file
# `npm publish` uploads, so this is the test of the package — just earlier.
#
# `workflow_call` so the publish job can require it: nothing reaches npm
# without having run on Linux, macOS and Windows first.

name: npm smoke

on:
  workflow_dispatch:
    inputs:
      from-registry:
        description: Install name@version from npm instead of packing the checkout
        type: boolean
        default: false
  # `from-registry: true` is the check AFTER a publish, from release.yml: what
  # npm serves is what was tested before it went out.
  workflow_call:
    inputs:
      from-registry:
        type: boolean
        default: false
  # Anything that changes what the tarball contains, how it starts, or whether
  # the suite still passes. Seven jobs a push is the price; finding out at
  # release time is the alternative, and that is what this list is widened for:
  # a test-only commit used to reach `main` without running once.
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - test/**
      - web/**
      - installer/logo.png
      - scripts/**
      - .github/workflows/npm-smoke.yml

permissions:
  contents: read

jobs:
  # ┌────────────────────────────────────────────────────────────────────────┐
  # │ 🔴 THE SUITE USED TO RUN ONLY ON A TAG, i.e. only while cutting a       │
  # │ release. (added 16/09/2026, after it cost one)                          │
  # │                                                                         │
  # │ `release.yml` runs `npm test` BEFORE `build:all`, so a test that needs   │
  # │ `web/dist` passes on a developer machine — where it is lying around      │
  # │ from the last build — and fails on CI at the one moment nothing else     │
  # │ can proceed. Every push to `main` was green while `main` was broken.     │
  # │                                                                         │
  # │ ⚠ It deliberately does NOT build the web bundle first. Running the       │
  # │ suite in the same barren state `release.yml` gives it is the whole       │
  # │ point: a test that quietly depends on a build artefact must fail HERE.   │
  # │                                                                         │
  # │ 🔴 AND UNTIL 18/09/2026 IT RAN ON WINDOWS ALONE. The suite had never      │
  # │ executed on macOS or Linux, in either workflow — `release.yml:75` is     │
  # │ windows too — while `smoke` below had crossed all three from the start.  │
  # │ The gap is easy to miss because the file looks covered: the two ask      │
  # │ different questions. SMOKE asks whether an installed package runs;       │
  # │ THE SUITE asks whether the logic is right. Only the first was ever       │
  # │ asked off Windows, and `paths.ts:289` is the standing example of what    │
  # │ that hides — macOS normalises filenames to NFD where Linux and Windows   │
  # │ keep NFC, so the same Vietnamese name is two different byte strings and  │
  # │ no Windows run can tell.                                                 │
  # │                                                                          │
  # │ ⚠ `fail-fast: false` earns its place here more than anywhere else in     │
  # │ this file. The first red run IS the deliverable: it names which tests    │
  # │ read the real `process.platform` instead of injecting one the way        │
  # │ `claude-code.test.ts` does. Cancelling the sibling legs would throw      │
  # │ away the very list being asked for.                                      │
  # │                                                                          │
  # │ ⚠ One node version, not two. `smoke` crosses 22 and 24 because it        │
  # │ exercises the runtime's install shape; the suite exercises our logic,    │
  # │ where a second runtime costs three more jobs and asks no new question.   │
  # │                                                                          │
  # │ ⚠ THIS IS A RELEASE GATE, not a report. `release.yml` calls this whole   │
  # │ workflow as its `smoke` job and `npm` needs it, so a red macOS leg now   │
  # │ blocks a publish. That is the intent — but it means widening the matrix  │
  # │ widens what a release must satisfy, which is a thing to know before a    │
  # │ tag is cut, not while one is waiting.                                    │
  # └────────────────────────────────────────────────────────────────────────┘
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: suite · ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `engines` says >=22. 22 is what most people have; 24 is the current
        # LTS a fresh install gets — the one nobody on this project runs.
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm --prefix web ci

      # The two tools a Linux desktop brings: the spec's validator, and the
      # launcher library that reads a .desktop file the way a click does.
      - name: Desktop tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils libglib2.0-bin

      - run: npm run smoke:npm
        env:
          SMOKE_STRICT: '1'
          SMOKE_FROM_REGISTRY: ${{ inputs.from-registry && '1' || '' }}

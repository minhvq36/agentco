# Build and publish a release: the Windows installer, then the npm package.
# -> docs/CLAUDE.md §Versions and releasing · docs/SPEC-cli.md §6
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS EXISTS, BEYOND CONVENIENCE
#
# Releasing was six commands in the right order on one person's machine, and a
# forgotten step announced itself by a customer downloading the wrong thing.
# Worse, the build COPIES THE BUILD MACHINE'S NODE into the tree
# (`scripts/package.ts`), so "it worked on my laptop" was load-bearing in the
# literal sense: the runtime a customer runs was whatever that laptop had.
#
# It is also the shape code signing needs. SignPath and every service like it
# sign artifacts produced by a CI run they can verify — repo, branch, commit —
# and refuse a file a developer built locally and uploaded. Without this file
# there is nothing to sign. -> the signing step goes in below, once granted.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags: ['v*']
  # ⚠ A DRY RUN EXISTS BECAUSE THE OBVIOUS TEST IS DESTRUCTIVE. Proving this
  # pipeline by deleting a tag and pushing it again would break the download
  # link for minutes AND change the installer's hash — NSIS embeds timestamps,
  # so a rebuild is never byte-identical. Any checksum already published, or
  # submitted to Microsoft for reputation review, is about the exact file
  # attached to the release and nothing else. So: run everything, publish
  # nothing, keep the artifact.
  workflow_dispatch:

# The Windows job creates a GitHub Release and needs this. The npm jobs set
# their own, narrower permissions — a job-level block replaces this one.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      # ⚠ PINNED, and it is not pedantry: `scripts/package.ts` ships THIS node
      # as the runtime layer (`runtime/node-v<version>`). The version here is
      # the version on the customer's disk.
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci
      - run: npm --prefix web ci

      # 🔴 ONE NUMBER. The tag and package.json must agree before anything is
      # built — the alternative is a release called v0.2.0 containing app/0.1.0,
      # which nothing downstream would notice. -> docs/CLAUDE.md §Versions
      - name: Settle the version
        id: version
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}' -replace '^v', ''
            if ($pkg -ne $tag) {
              throw "tag $tag does not match package.json $pkg - bump one of them"
            }
          }
          "value=$pkg" >> $env:GITHUB_OUTPUT
          "version $pkg"

      - run: npm test

      - run: npm run build:all

      # NSIS builds BOTH the launcher (inside package.ts) and the installer, so
      # it has to be here before packaging, not after.
      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build the packaged tree
        run: node --experimental-strip-types scripts/package.ts

      # 🔴 THE SILENT FAILURE THIS STEP EXISTS FOR: with NSIS missing,
      # `package.ts` prints "launcher SKIPPED" and exits 0. The release would
      # then ship an installer with no `AgentCo.exe` — the icon a customer
      # double-clicks — and every check upstream would still be green.
      - name: The launcher must exist
        run: |
          $exe = 'out/AgentCo/AgentCo.exe'
          if (-not (Test-Path $exe)) {
            throw "no launcher at $exe - NSIS was missing and package.ts skipped it"
          }
          $app = "out/AgentCo/app/$((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          if (-not (Test-Path $app)) { throw "no app layer at $app" }
          "launcher and app layer present"

      - name: Build the installer
        run: |
          $ver = '${{ steps.version.outputs.value }}'
          # ⚠ `${env:...}` braces, not `$env:...`: the parentheses in
          # `ProgramFiles(x86)` end the variable name otherwise, and the line
          # fails with a parser error that says nothing about the path.
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "no makensis at $makensis" }
          # 🔴 ABSOLUTE, ALWAYS. NSIS resolves a relative `File` path against
          # the SCRIPT'S directory, not the working directory — so a relative
          # `out\AgentCo` became `installer\out\AgentCo`, matched nothing, and
          # failed with "no files found" while the tree sat right there. It
          # never showed up locally because the local runs passed a full path.
          $tree = (Resolve-Path out\AgentCo).Path
          & $makensis /V2 "/DTREE=$tree" "/DVER=$ver" installer\agentco.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis exited $LASTEXITCODE" }

      # ⚠ The filename carries no version on purpose: GitHub's
      # `releases/latest/download/<name>` alias resolves by exact filename and
      # the website's download button is a constant. -> agentco-web/SPEC.md §2
      - name: Checksum
        id: sum
        run: |
          $exe = 'out/AgentCo-win-x64-setup.exe'
          if (-not (Test-Path $exe)) { throw "no installer at $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  $([math]::Round((Get-Item $exe).Length/1MB,2)) MB"

      # 🔴 THE THING A RUNNING COPY FETCHES. Until 17/09/2026 a release
      # published one asset — the installer — so the update design in
      # SPEC-packaging §3.7 sat above a file that did not exist. The app layer
      # is the ~25 MB that moves weekly; `runtime/` moves twice a year and
      # `company/` is the customer's, which is what §2's split was for.
      #
      # ⚠ Its `.json` sidecar carries the size and sha256. `release-web.ts` runs
      # hours later on another machine and has to put those in the manifest; a
      # number that only existed in a CI log would be copied by hand, and a hash
      # copied by hand is eventually wrong.
      - name: Pack the app layer
        run: |
          node --experimental-strip-types scripts/pack-layer.ts --tree out/AgentCo --out out
          $layer = Get-ChildItem out/agentco-app-*.tar.gz
          if (-not $layer) { throw "pack-layer produced nothing" }
          "layer=$($layer.Name)" >> $env:GITHUB_OUTPUT
        id: layer

      # 🔴 WHAT CHANGED GOES FIRST, AND ITS ABSENCE STOPS THE RELEASE (24/09).
      # The body used to be `.github/release-notes.md` alone — identical on
      # every version. The script prepends this version's `CHANGELOG.md`
      # section and exits 1 when there is none, before anything is published.
      # `npm version` ran the same check already; this catches a tag pushed
      # any other way. -> scripts/release-notes.ts
      - name: Release notes
        run: |
          node --experimental-strip-types scripts/release-notes.ts --sha256 '${{ steps.sum.outputs.sha256 }}' --out notes.md
          if ($LASTEXITCODE -ne 0) { throw "release notes failed - see CHANGELOG.md" }
          Get-Content notes.md -TotalCount 12

      # A dry run stops here and hands the installer back as a build artifact:
      # everything above is proven, nothing outside this repository moved.
      - name: Keep the installer (dry run)
        if: github.event_name == 'workflow_dispatch'
        # v6: the first major on node24. v4 and v5 are node20, which GitHub
        # deprecated and now forces onto node24 with a warning on every run.
        uses: actions/upload-artifact@v6
        with:
          name: AgentCo-win-x64-setup
          path: out/AgentCo-win-x64-setup.exe
          if-no-files-found: error

      # 🔴 `--latest` IS THE LINE THE DOWNLOAD BUTTON DEPENDS ON. A release
      # marked as a pre-release is excluded from `releases/latest`, so the
      # website would 404 while this job stayed green and the release page
      # looked perfect.
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $layer = (Get-ChildItem out/agentco-app-*.tar.gz).FullName
          gh release create '${{ github.ref_name }}' `
            'out/AgentCo-win-x64-setup.exe' `
            $layer `
            "$layer.json" `
            --title '${{ github.ref_name }}' `
            --notes-file notes.md `
            --latest

      # A last look from outside: the URL the website actually uses must answer
      # with these exact bytes. Everything above proves we built a file; this
      # proves a stranger can get it.
      - name: The download alias must serve what we just built
        if: github.event_name == 'push'
        run: |
          $url = 'https://github.com/${{ github.repository }}/releases/latest/download/AgentCo-win-x64-setup.exe'
          Invoke-WebRequest $url -OutFile check.exe -UseBasicParsing -MaximumRedirection 5
          $got = (Get-FileHash check.exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne '${{ steps.sum.outputs.sha256 }}') {
            throw "alias served $got, expected ${{ steps.sum.outputs.sha256 }}"
          }
          "alias serves the same bytes"

  # ───────────────────────────────────────────────────────────────────────────
  # THE NPM DOOR. -> docs/SPEC-cli.md §6
  #
  # 🔴 NOTHING REACHES NPM WITHOUT HAVING RUN ON ALL THREE SYSTEMS FIRST. A
  # published version number can never be cut again, so the smoke run is a
  # precondition here, not a report. npm also waits for the Windows job: ONE
  # NUMBER means both doors carry a version, or neither does.
  # ───────────────────────────────────────────────────────────────────────────
  smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/npm-smoke.yml

  npm:
    needs: [smoke, windows]
    runs-on: ubuntu-latest
    # Trusted publishing: npmjs.com trusts THIS workflow's OIDC identity
    # (minhvq36/agentco, release.yml). No npm token exists anywhere to leak,
    # and each version gets a provenance statement without asking for one.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # ⚠ `npm stage publish` needs npm >= 11.15.0 (trusted publishing alone
      # needed 11.5.1). An older npm does not know the command at all.
      - run: npm install -g npm@^11.15.0

      - run: npm ci
      - run: npm --prefix web ci

      # 🔴 ALREADY PUBLISHED IS NOT A FAILURE. 0.1.1 went out by hand (trusted
      # publishing can only be set up for a package that exists), and any tag
      # re-run meets the same wall: npm refuses to publish over a version.
      # ⚠ `npm view name@<unknown version>` exits 0 with EMPTY output — only a
      # missing PACKAGE is an error — so the output is compared, not the code.
      - name: Settle the version
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $pkg - bump one of them"
            exit 1
          fi
          got=$(npm view "$name@$pkg" version 2>/dev/null || true)
          if [ "$got" = "$pkg" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$pkg is already on npm - nothing to publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 🔴 STAGE, NEVER PUBLISH. The trusted publisher on npmjs.com allows
      # `npm stage publish` and nothing else (settled 14/09): a version goes
      # public only when a maintainer approves it in the Staged Packages tab,
      # with a passkey. If anything in this pipeline is ever taken over — an
      # action pinned by tag, a dependency `npm ci` runs, a leaked key that
      # pushes a tag — what it built waits in a queue instead of reaching every
      # `npm i -g`. The three-system smoke run proves the package WORKS; it
      # says nothing about whether it is honest. That check is a human's.
      # ⚠ A tag re-run while its version still waits for approval stages it
      # again: `npm stage list` needs an interactive login, so this job cannot
      # see the queue. Reject the duplicate on npmjs.com.
      # ⚠ A DRY RUN STILL ASKS THE REGISTRY, and refuses a version that is
      # already out. Measured on the first manual run, 14/09: "You cannot
      # publish over the previously published versions: 0.1.1". So it stages a
      # throwaway prerelease of the same code, on this runner only — the
      # command, this npm and the tarball are exercised; the real number is not.
      # ⚠ `--ignore-scripts`: since 24/09 the `version` lifecycle script
      # refuses a number with no CHANGELOG.md section — and a throwaway
      # `-dryrun.<id>` never has one. Measured on the first dry run after the
      # gate landed (run 36025380026): this step, and only this step, went red.
      # The gate is for numbers that ship; this one never does.
      - name: Stage (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          ver=$(node -p "require('./package.json').version")
          npm version "$ver-dryrun.${{ github.run_id }}" --no-git-tag-version --ignore-scripts
          npm stage publish . --dry-run --tag dryrun

      - name: Stage for approval
        if: github.event_name == 'push' && steps.version.outputs.exists == 'false'
        run: |
          npm stage publish . --provenance
          echo "::notice::staged - approve it on npmjs.com: package page, Staged Packages tab"

  # 🔴 A HUMAN IS IN THE LOOP, so the check of what npm serves waits for them.
  # One idle runner polls; the three-system install starts only once the
  # version is live. Red after 6 hours means "not approved yet" and is meant to
  # read as the reminder it is — approve, then run `npm smoke` by hand with
  # from-registry ticked.
  npm-approved:
    needs: npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Wait until the version is live on npm
        run: |
          ver="${GITHUB_REF_NAME#v}"
          spec="$(node -p "require('./package.json').name")@$ver"
          # 🔴 LIVE MEANS DOWNLOADABLE, not just listed (0.2.8, 24/09): the
          # version showed up in `npm view` while its .tgz still 404'd on the
          # CDN, and npm-verify failed on most legs. So the tarball URL has to
          # answer too. -> scripts/smoke-npm.ts, same probe
          for i in $(seq 1 350); do
            got=$(npm view "$spec" version --prefer-online 2>/dev/null || true)
            if [ "$got" = "$ver" ]; then
              tgz=$(npm view "$spec" dist.tarball --prefer-online 2>/dev/null || true)
              if [ -n "$tgz" ] && curl -sfI "$tgz" >/dev/null; then echo "$spec is live and downloadable"; exit 0; fi
            fi
            if [ $((i % 30)) -eq 1 ]; then
              echo "::notice::waiting for $spec - approve it in the Staged Packages tab on npmjs.com"
            fi
            sleep 60
          done
          echo "::error::$spec was not approved within 6 hours - approve it, then run 'npm smoke' by hand with from-registry ticked"
          exit 1

  # What npm serves, installed and run on all three systems — also on a tag
  # whose version was already out, which is exactly when nobody would look.
  npm-verify:
    needs: npm-approved
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/npm-smoke.yml
    with:
      from-registry: true

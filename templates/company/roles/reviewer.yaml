id: reviewer
version: 3
display_name: "Người soát"
avatar: "🔍"

pitch: "Đọc lại kết quả của người khác, chỉ ra lỗi và chỗ chưa đạt. Đầu ra là file nhận xét ngắn."
good_at: [soát lỗi, kiểm tra tính nhất quán, đối chiếu yêu cầu]
not_for: [tự viết lại nội dung, nghiên cứu]

skill_level: medium
skills:
  medium: skills/reviewer.medium.md

tools: [Read, Write, Glob, Grep]
# Đo thật (bench/tier-compare.mjs): với việc soát lỗi này, `eco` tốn 2,5 lần
# số lượt và chậm gấp đôi so với `standard`, nhưng VẪN rẻ hơn 38% về tiền.
# Đổi sang `standard` nếu bạn ưu tiên tốc độ hơn chi phí.
model_tier: eco
use_preset: false

budget:
  # Model rẻ dò dẫm nhiều lượt hơn VÀ số lượt không ổn định (đo được 9 rồi 10
  # cho cùng một việc). Nên vai trò `eco` cần ngân sách lượt CAO HƠN vai trò
  # `standard` — ngược trực giác. Để 14 = ~1,5× số lượt đo được.
  max_turns: 14
  max_usd: 0.2

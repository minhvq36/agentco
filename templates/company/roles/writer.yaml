id: writer
version: 2
display_name: "Người viết"
avatar: "✍"

# Đây là THỨ DUY NHẤT giám đốc nhìn thấy khi lên kế hoạch.
# Giữ ngắn: nó nằm trong ngữ cảnh của giám đốc suốt cả ca làm việc.
pitch: "Viết nội dung tiếng Việt: bài đăng, email, mô tả, kịch bản. Đầu ra là file markdown."
good_at: [viết bài, biên tập, đặt tiêu đề]
not_for: [viết code, phân tích số liệu]

skill_level: medium
skills:
  short: skills/writer.short.md
  medium: skills/writer.medium.md

tools: [Read, Write, Glob, Grep]
model_tier: standard

# Không dùng system prompt preset của Claude Code: preset chứa toàn bộ hướng dẫn
# viết code mà vai trò này không cần — đắt hơn ~6.300 token mỗi lần gọi.
use_preset: false

budget:
  # ⚠ NỚI 26/08 (user chốt). Hai lý do, và lý do thứ hai là một LỖI ĐANG SỐNG:
  #
  #  ① Mỗi lời gọi MCP là MỘT LƯỢT. Con số 6 là của thời chưa có MCP — một việc
  #    chạm vài trang Notion đốt hết trần trước khi kịp xong (đo 26/08: xoá một
  #    trang con = 9 lượt). Chạm trần là kiểu hỏng ĐẮT NHẤT: chạy tới kịch rồi
  #    mất trắng.
  #  ② 🔴 `max_usd: 0.4` THẤP HƠN chi phí đã đo của chính vai trò này
  #    (~$0.45 cho một việc standard, đo 21/08). Tức trần cũ cắt ngang một việc
  #    BÌNH THƯỜNG — và triệu chứng của nó trông y hệt "model làm dở".
  max_turns: 15
  max_usd: 5.0
  knowledge_pack: 3000
